<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>reference.maxpat bridge test</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #383838; color: #fff; margin: 0; padding: 24px; }
  button { background: #FFA500; border: none; padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; }
  #log { margin-top: 16px; font-size: 12px; color: #aaa; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>jweb bridge test</h2>
  <p>If you can see this styled page inside jweb, <code>read</code> worked.</p>
  <button id="ping">Send to Max</button>
  <div id="log"></div>

<script>
  const logEl = document.getElementById("log");
  const log = (msg) => { logEl.textContent += msg + "\n"; };

  document.getElementById("ping").addEventListener("click", () => {
    if (window.max) {
      window.max.outlet("message", JSON.stringify({ ping: Date.now() }));
      log("Sent via window.max.outlet — check the Max console (or a [print] object on jweb's outlet).");
    } else {
      log("window.max is not available — this page isn't running inside jweb.");
    }
  });

  if (window.max) {
    window.max.bindInlet("message", (payload) => {
      log("Received from Max: " + payload);
    });
    log("window.max detected. bindInlet('message', ...) registered.");
  } else {
    log("window.max NOT detected yet.");
  }
</script>
</body>
</html>
