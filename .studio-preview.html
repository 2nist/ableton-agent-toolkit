<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Progression Studio</title>
<style>
  /* Ableton's own dark chrome — matches @ableton ui-kit ABLETON_DARK tokens. */
  :root { --bg:#383838; --panel:#4E4E4E; --card:#4E4E4E; --border:#2C2C2C; --text:#FFFFFF; --muted:#B0B0B0; --accent:#FFA500; --accent-hover:#FFB733; --accent-active:#CC8400; --radius:2px; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; font-size:11px; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; gap:6px; align-items:center; padding:4px 8px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header h1 { font-size:11px; margin:0 8px 0 0; letter-spacing:.2px; color:var(--text); font-weight:600; }
  header label { display:flex; align-items:center; gap:3px; color:var(--muted); font-size:10px; white-space:nowrap; }
  select, button { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:1px 5px; font-size:10px; height:19px; cursor:pointer; }
  select:focus, button:focus { outline:1px solid var(--accent); }
  .live-readout { color:var(--accent); font-weight:600; font-size:10px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  button.primary:hover { background:var(--accent-hover); }
  button.danger { background:transparent; border-color:var(--border); color:var(--muted); }
  .spacer { flex:1; }
  main { flex:1; overflow-y:auto; padding:6px 8px; }
  section { margin-bottom:7px; }
  h2 { font-size:9px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); margin:0 0 3px; }
  #strip { display:flex; gap:2px; height:16px; }
  .strip-cell { flex:1; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#000; font-weight:700; text-shadow:none; overflow:hidden; }
  #canvas { display:flex; flex-direction:column; gap:2px; }
  .card { display:flex; align-items:center; gap:5px; background:var(--panel); border:1px solid var(--border); border-left:3px solid #888; border-radius:2px; padding:2px 6px; }
  .card .degree { font-size:13px; font-weight:700; min-width:26px; }
  .card .root { font-size:10px; color:var(--muted); min-width:26px; }
  .card select { font-size:10px; height:17px; padding:0 2px; }
  .card .tens { font-size:10px; color:var(--muted); min-width:32px; text-align:right; }
  .card .ops button { padding:0 4px; height:17px; font-size:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; }
  .chip { padding:1px 6px; border-radius:2px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:10px; color:#000; font-weight:700; height:18px; }
  .chip .prob { opacity:.75; font-size:9px; margin-left:3px; }
  .path-btn { display:inline-block; margin:0 3px 3px 0; padding:1px 6px; border-radius:2px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:10px; color:#fff; height:18px; }
  .song-match { padding:1px 6px; margin:0 3px 3px 0; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:2px; background:var(--card); font-size:10px; color:var(--text); cursor:pointer; }
  .song-match:hover { border-color:var(--accent); }
  .song-match.partial { opacity:.72; border-style:dashed; }
  .song-deg { font-size:9px; color:var(--muted); }
  .songs-head { font-size:10px; color:var(--muted); margin-bottom:3px; }
  .empty { color:var(--muted); font-size:10px; }
  #add { margin-top:3px; height:19px; }
</style>
</head>
<body>
  <header>
    <h1>Progression Studio</h1>
    <label>Key <select id="key"></select></label>
    <label>Octave <select id="octave"></select></label>
    <label>Preset <select id="preset"><option value="">—</option></select></label>
    <label title="Use Live's current scale root"><input type="checkbox" id="useLiveKey" checked /> Live key</label>
    <label title="Live's key + time signature"><span id="liveReadout" class="live-readout">A · Minor · 4/4</span></label>
    <label title="Penalize repeated chords in suggestions"><input type="checkbox" id="variety" checked /> Variety</label>
    <button id="transposeDown" title="Transpose whole progression down">&#9837;</button>
    <button id="transposeUp" title="Transpose whole progression up">&#9839;</button>
    <label title="Add a monophonic melody over the progression"><input type="checkbox" id="melody"  /> Melody</label>
    <label title="How long each melody note can last; shorter = more notes">Density <select id="density"><option value="8">smooth</option><option value="4" selected>medium</option><option value="2">flowing</option><option value="1">dense</option></select></label>
    <label title="Layer a bi-tonal color chord above the progression">Color <select id="flavor"><option value="">—</option><option value="cinematic_shimmer" title="Anchor maj +5th → Maj9">Shimmer</option><option value="sci_fi_wonder" title="Anchor maj +2nd → Maj13(#11)">Wonder</option><option value="bittersweet_drama" title="Anchor maj +7th(min) → Maj9(#11)">Drama</option><option value="neo_soul_glow" title="Anchor min +m7 → m11">Glow</option><option value="ambient_ocean" title="Anchor min +5th → m9">Ocean</option><option value="altered_tension" title="Anchor 7 +b2 → 7(b9#9#11)">Tension</option></select></label>
    <span class="spacer"></span>
    <button id="render" class="primary">Render to Live &amp; Close</button>
    <button id="cancel" class="danger">Cancel</button>
  </header>
  <main>
    <section><h2>Tension curve</h2><div id="strip"></div></section>
    <section><h2>Progression</h2><div id="canvas"></div><button id="add">+ Add chord</button></section>
    <section><h2>Next chord (from corpus)</h2><div id="suggest" class="chips"></div></section>
    <section><h2>Top paths (corpus-ranked continuations)</h2><div id="paths"></div></section>
    <section><h2>Matching songs (lead sheets)</h2><div id="songs"></div></section>
  </main>

    if (densitySel) densitySel.value = String(state.density);
    const flavorSel = $("#flavor");
    if (flavorSel) flavorSel.value = state.flavor;
    const presetSel = $("#preset");
    presetSel.innerHTML = `<option value="">\u2014</option>` + Object.entries(presets).map(([key, p]) => `<option value="${esc(key)}">${esc(p.name)}</option>`).join("");
    const strip = $("#strip");
    if (state.cards.length === 0) {
      strip.innerHTML = `<div class="strip-cell" style="background:#3a414a">add chords to see tension</div>`;
    } else {
      strip.innerHTML = state.cards.map((c) => `<div class="strip-cell" style="background:${cardColor(c.degree)}" title="${esc(c.degree)} ${tension(model, c.degree).tension.toFixed(2)}">${esc(c.degree)}</div>`).join("");
    }
    const canvas = $("#canvas");
    canvas.innerHTML = state.cards.length ? state.cards.map((c, i) => `
  <div class="card" style="border-left-color:${cardColor(c.degree)}">
    <div class="degree" style="color:${cardColor(c.degree)}">${esc(c.degree)}</div>
    <div class="root">${esc(rootName(c.degree))}</div>
    <select data-i="${i}" data-field="degree">${DEGREES.map((d) => `<option ${d === c.degree ? "selected" : ""}>${d}</option>`).join("")}</select>
    <select data-i="${i}" data-field="quality">${QUALITIES.map((q) => `<option ${q === c.quality ? "selected" : ""}>${q}</option>`).join("")}</select>
    <select data-i="${i}" data-field="beats">${beatOptions().map((b) => `<option value="${b}" ${b === c.beats ? "selected" : ""}>${beatLabel(b)}</option>`).join("")}</select>
    <span class="tens">${tension(model, c.degree).tension.toFixed(2)}</span>
    <span class="ops">
      <button data-i="${i}" data-op="left" title="Move left">&larr;</button>
      <button data-i="${i}" data-op="right" title="Move right">&rarr;</button>
      <button data-i="${i}" data-op="dup" title="Duplicate">+</button>
      <button data-i="${i}" data-op="del" title="Delete">&times;</button>
    </span>
  </div>`).join("") : `<div class="empty">No chords yet \u2014 load a preset, add a chord, or click a suggestion.</div>`;
    const sug = $("#suggest");
    if (state.cards.length === 0) {
      sug.innerHTML = `<span class="empty">Add a chord to see corpus-ranked next chords.</span>`;
    } else {
      const next = suggestNext(model, tail().slice(-2), suggestOpts()).slice(0, 7);
      sug.innerHTML = next.length ? next.map(
        (s) => `<button class="chip" style="background:${cardColor(s.degree)}" data-next="${esc(s.degree)}">${esc(s.degree)} <span class="prob">${(s.probability * 100).toFixed(0)}%</span></button>`
      ).join("") : `<span class="empty">No suggestions for this tail.</span>`;
    }
    const paths = $("#paths");
    if (state.cards.length === 0) {
      paths.innerHTML = `<span class="empty">Add a chord to see top continuations.</span>`;
    } else {
      const ranked = rankPaths(model, tail().slice(-1), 4, 4, suggestOpts());
      paths.innerHTML = ranked.length ? ranked.map((p) => `<button class="path-btn" data-path="${esc(p.degrees.join(" "))}">${esc(p.degrees.join(" "))} <span class="prob">${(p.probability * 100).toFixed(1)}%</span></button>`).join("") : `<span class="empty">No continuations.</span>`;
    }
    const songs = $("#songs");
    if (!songs) return;
    if (!songIndex) {
      songs.innerHTML = `<span class="empty">Song matching unavailable (no song index in this build).</span>`;
    } else if (state.cards.length < 2) {
      songs.innerHTML = `<span class="empty">Add at least 2 chords to see songs that use this progression.</span>`;
    } else {
      const degrees = state.cards.map((c) => c.degree);
      const matches = findMatchingSongs(songIndex, degrees, { maxResults: 24 });
      const total = matches.length;
      if (total === 0) {
        songs.innerHTML = `<span class="empty">No songs in the corpus use <b>${esc(degrees.join(" "))}</b> in order.</span>`;
      } else {
        const exact = matches.filter((m) => !m.partial).length;
        const header = total > 1 ? `<div class="songs-head">${total} songs match \u2014 ${exact} exact</div>` : `<div class="songs-head">1 song matches</div>`;
        songs.innerHTML = header + matches.map(
          (m) => `<div class="song-match${m.partial ? " partial" : ""}" data-load="${esc(m.code)}" title="${m.partial ? "In order with passing chords in between \u2014 click to load" : "Click to load this song's progression"}">${esc(m.name)}<span class="song-deg">${esc(decodeProgression(m.code).join(" "))}</span></div>`
        ).join("");
      }
    }
  }
  function $(sel) {
    return document.querySelector(sel);
  }
  function addChord(degree, quality, beats = defaultBeats()) {
    state.cards.push({ degree, quality: quality ?? TRIAD[degree] ?? "maj", beats });
    render();
  }
  function bind() {
    $("#key").addEventListener("change", (e) => {
      state.keyIndex = Number(e.target.value);
      render();
    });
    $("#octave").addEventListener("change", (e) => {
      state.octave = Number(e.target.value);
    });
    $("#variety").addEventListener("change", (e) => {
      state.variety = e.target.checked;
      render();
    });
    $("#density")?.addEventListener("change", (e) => {
      state.density = Number(e.target.value);
    });
    $("#melody")?.addEventListener("change", (e) => {
      state.melody = e.target.checked;
    });
    $("#flavor")?.addEventListener("change", (e) => {
      state.flavor = e.target.value;
    });
    $("#useLiveKey")?.addEventListener("change", (e) => {
      state.useLiveKey = e.target.checked;
      if (state.useLiveKey && live) {
        state.keyIndex = (live.rootNote % 12 + 12) % 12;
        render();
      }
    });
    $("#preset").addEventListener("change", (e) => {
      const key = e.target.value;
      if (!key || !presets[key]) return;
      state.cards = presets[key].degrees.map((d) => ({ degree: d, quality: TRIAD[d] ?? "maj", beats: defaultBeats() }));
      render();
    });
    $("#transposeDown").addEventListener("click", () => {
      state.keyIndex = (state.keyIndex + 11) % 12;
      render();
    });
    $("#transposeUp").addEventListener("click", () => {
      state.keyIndex = (state.keyIndex + 1) % 12;
      render();
    });
    $("#add").addEventListener("click", () => {
      const next = suggestNext(model, tail().slice(-1), suggestOpts());
      addChord(next.length ? next[0].degree : "I");
    });
    $("#render").addEventListener("click", () => {
      if (state.cards.length === 0) return;
      const result = {
        key: NOTES[state.keyIndex],
        octave: state.octave,
        mode: MELODY_MODE ? "melody" : "studio",
        melody: state.melody,
        maxNoteBeats: state.density,
        useLiveKey: state.useLiveKey,
        biTonalFlavor: state.flavor || void 0,
        live: live ? { rootNote: live.rootNote, scaleName: live.scaleName, signatureNumerator: live.signatureNumerator, signatureDenominator: live.signatureDenominator } : null,
        chords: state.cards.map((c) => ({ degree: c.degree, quality: c.quality, durationBeats: c.beats }))
      };
      closeWithResult(JSON.stringify(result));
    });
    $("#cancel").addEventListener("click", () => closeWithResult(""));
    $("#canvas").addEventListener("change", (e) => {
      const target = e.target;
      const i = Number(target.dataset.i);
      const field = target.dataset.field;
      if (field === "degree") state.cards[i].degree = target.value;
      else if (field === "quality") state.cards[i].quality = target.value;
      else if (field === "beats") state.cards[i].beats = Number(target.value);
      render();
    });
    $("#canvas").addEventListener("click", (e) => {
      const target = e.target.closest("button[data-op]");
      if (!target) return;
      const i = Number(target.dataset.i);
      const op = target.dataset.op;
      const cards = state.cards;
      if (op === "left" && i > 0) [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]];
      else if (op === "right" && i < cards.length - 1) [cards[i + 1], cards[i]] = [cards[i], cards[i + 1]];
      else if (op === "dup") cards.splice(i + 1, 0, { ...cards[i] });
      else if (op === "del") cards.splice(i, 1);
      render();
    });
    $("#suggest").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-next]");
      if (btn) addChord(btn.dataset.next);
    });
    $("#paths").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-path]");
      if (!btn) return;
      const degrees = btn.dataset.path.split(" ");
      state.cards = degrees.map((d) => ({ degree: d, quality: TRIAD[d] ?? "maj", beats: defaultBeats() }));
      render();
    });
    $("#songs").addEventListener("click", (e) => {
      const el = e.target.closest(".song-match");
      if (!el || !el.dataset.load) return;
      const degrees = decodeProgression(el.dataset.load);
      if (degrees.length === 0) return;
      state.cards = degrees.map((d) => ({ degree: d, quality: TRIAD[d] ?? "maj", beats: defaultBeats() }));
      render();
    });
  }
  async function boot() {
    bind();
    state.cards = (presets.pop_progression?.degrees ?? ["I", "V", "vi", "IV"]).map((d) => ({
      degree: d,
      quality: TRIAD[d] ?? "maj",
      beats: defaultBeats()
    }));
    if (state.useLiveKey && live) {
      state.keyIndex = (live.rootNote % 12 + 12) % 12;
    }
    render();
    await loadSongIndex();
    render();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
